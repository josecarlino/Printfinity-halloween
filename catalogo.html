<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Catálogo · Printfinity</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;}
  body{overscroll-behavior:none;}
  main>:first-child{margin-top:0!important;}
  main>:last-child{margin-bottom:0!important;}
  .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="bg-canvas-base font-body-md text-text-primary min-h-screen flex flex-col antialiased selection:bg-pumpkin-vibrant selection:text-canvas-base">

<header class="fixed top-0 left-0 right-0 z-50 bg-canvas-base/95 backdrop-blur-md border-b border-border-subtle">
  <div class="h-16 max-w-6xl mx-auto px-4 md:px-8 flex items-center justify-between">
    <a class="flex items-center gap-space-sm group text-inherit no-underline" href="index.html">
      <div class="w-7 h-7 rounded-lg bg-surface-card border border-border-subtle flex items-center justify-center transition-colors group-hover:border-pumpkin-vibrant/60">
        <span class="w-2 h-2 rounded-full bg-text-primary group-hover:bg-pumpkin-vibrant transition-colors"></span>
      </div>
      <span class="font-headline-sm text-headline-sm font-bold tracking-tight text-text-primary">Printfinity</span>
    </a>
  </div>
</header>

<main class="w-full pt-16 bg-canvas-base flex-1">
  <div class="w-full max-w-6xl mx-auto px-4 md:px-8 py-8 flex flex-col gap-8">

    <div class="w-full flex flex-col md:flex-row md:items-end justify-between gap-space-md">
      <div class="flex flex-col gap-1">
        <h1 id="cat-title" class="font-headline-lg text-headline-lg font-bold text-text-primary tracking-tight">
          Catálogo de <span id="cat-title-accent" class="text-pumpkin-vibrant">...</span>
        </h1>
        <p id="cat-description" class="font-body-md text-text-secondary max-w-2xl"></p>
      </div>
      <a class="inline-flex items-center gap-space-2xs text-text-secondary hover:text-pumpkin-vibrant font-label-md transition-colors group no-underline self-start md:self-end pb-1 whitespace-nowrap" href="index.html">
        <span class="material-symbols-outlined text-[20px] transition-transform group-hover:-translate-x-1">arrow_back</span>
        <span>Regresar a la página principal</span>
      </a>
    </div>

    <div class="w-full flex flex-col items-center">
      <div id="embed-wrapper" class="w-full"></div>
    </div>

    <div class="w-full pt-6 border-t border-border-subtle flex flex-col gap-space-md">
      <div class="flex items-center justify-between">
        <h2 class="font-headline-sm text-text-primary font-bold flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-pumpkin-vibrant"></span>
          <span>Otros catálogos</span>
        </h2>
      </div>
      <div id="other-catalogs" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-space-sm"></div>
    </div>

  </div>
</main>

<footer class="w-full bg-surface-card border-t border-border-subtle mt-auto">
  <div class="max-w-6xl mx-auto px-4 md:px-8 py-10 md:py-12 min-h-[100px] flex items-center">
    <div class="w-full flex flex-col sm:flex-row items-center justify-between gap-space-sm font-body-sm text-body-sm text-text-muted">
      <div class="flex items-center gap-space-xs">
        <span class="w-1.5 h-1.5 rounded-full bg-pumpkin-vibrant"></span>
        <span>Printfinity • Impresiones 3D</span>
      </div>
      <p>© 2026 Printfinity. Todos los derechos reservados.</p>
    </div>
  </div>
</footer>

<script src="assets/js/categories.js"></script>
<script>
  (function () {
    const categories = window.CATALOG_CATEGORIES || [];
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("cat");
    const current = categories.find(function (c) { return c.slug === slug; }) || categories[0];

    if (!current) {
      document.querySelector("main").innerHTML =
        '<div class="w-full max-w-6xl mx-auto px-4 md:px-8 py-16 text-center text-text-secondary">' +
        '<p class="font-headline-sm text-text-primary mb-2">No encontramos ese catálogo.</p>' +
        '<a class="text-pumpkin-vibrant hover:underline" href="index.html">Volver al inicio</a>' +
        '</div>';
      return;
    }

    document.title = "Catálogo de " + current.name + " · Printfinity";
    document.getElementById("cat-title-accent").textContent = current.name;
    document.getElementById("cat-description").textContent = current.pageDescription;

    // Contenedor 16:9 compartido por el embed real y el estado "próximamente",
    // así la altura no salta al cambiar de categoría.
    const embedWrapper = document.getElementById("embed-wrapper");
    if (current.embedUrl) {
      embedWrapper.innerHTML =
        '<div class="relative w-full rounded-xl border border-border-subtle overflow-hidden shadow-2xl bg-surface-card" style="padding-top:56.25%;">' +
          '<div id="embed-skeleton" class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-space-xs bg-surface-card text-text-muted select-none transition-opacity duration-300">' +
            '<span class="material-symbols-outlined text-[32px] text-pumpkin-vibrant animate-spin">progress_activity</span>' +
            '<span class="font-label-md text-text-muted">Cargando catálogo…</span>' +
          '</div>' +
          '<iframe id="embed-iframe" loading="lazy" class="absolute inset-0 w-full h-full border-0" ' +
            'src="' + current.embedUrl + '" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>' +
        '</div>' +
        (current.canvaLink
          ? '<p class="mt-3 font-body-sm text-body-sm text-text-muted">' +
              '<a href="' + current.canvaLink + '" target="_blank" rel="noopener" class="text-text-secondary hover:text-pumpkin-vibrant transition-colors">Ver "' + 'Catálogo ' + current.name + '"</a>' +
              (current.author ? ' de ' + current.author : '') +
              ' en Canva' +
            '</p>'
          : '');

      const skeleton = document.getElementById("embed-skeleton");
      const iframe = document.getElementById("embed-iframe");
      iframe.addEventListener("load", function () {
        skeleton.style.opacity = "0";
        setTimeout(function () { skeleton.style.display = "none"; }, 300);
      });
    } else {
      embedWrapper.innerHTML =
        '<div class="relative w-full rounded-xl border border-border-subtle overflow-hidden shadow-2xl bg-surface-card" style="padding-top:56.25%;">' +
          '<div class="absolute inset-0 flex flex-col items-center justify-center gap-space-xs text-center p-space-md text-text-muted select-none">' +
            '<span class="material-symbols-outlined text-[36px] text-text-muted/60">hourglass_top</span>' +
            '<span class="font-label-md text-text-muted">Este catálogo estará disponible próximamente</span>' +
            '<span class="font-body-sm text-text-muted/60 text-xs">Vuelve pronto para ver las piezas de ' + current.name.toLowerCase() + '.</span>' +
          '</div>' +
        '</div>';
    }

    const others = categories.filter(function (c) { return c.slug !== current.slug; });
    document.getElementById("other-catalogs").innerHTML = others.map(function (c) {
      return (
        '<a class="p-space-sm rounded-lg bg-surface-card border border-border-subtle hover:border-pumpkin-vibrant/50 hover:bg-surface-subtle transition-all flex flex-col items-center text-center gap-2 group no-underline" href="catalogo.html?cat=' + c.slug + '">' +
          '<div class="w-10 h-10 rounded-lg bg-surface-subtle group-hover:bg-pumpkin-vibrant/10 text-pumpkin-vibrant flex items-center justify-center transition-colors">' +
            '<span class="material-symbols-outlined text-[22px]">' + c.icon + '</span>' +
          '</div>' +
          '<span class="font-label-sm text-text-primary group-hover:text-pumpkin-vibrant font-medium truncate w-full">' + c.name + '</span>' +
        '</a>'
      );
    }).join("");
  })();
</script>
</body>
</html>
